;Set most Values to 1 to turn them on, 0 to turn them off.
;AutoCamActive = 1 - enable/disable ACam upon loading (effectively disables both camera and driver switching)
;defaultCamera = 3 - the first camera ACam will use
;countdownCam = 5 - camera to use during pre-race countdowns.  set to -1 to disable countdown
;cameraSwitchDelay = 10 - default camera switching delay
;cameraSwitchingEnabled = 1 - enable/disable camera switching
;driverSwitchingEnabled = 1 - enable/disable driver switching
;driverSwitchDelay = 15 - time to wait before seeking the next driver to switch to
;minPitKMH = 20.0 - cars driving faster in the pits may be switched to
;maxPitKMH = 85.0 - cars driving slower in the pits may be switched to
;offPaceSwitchDelay = 120.0 - limits how often a car may be considered off pace. average pace is calculated during qually sessions
;minSwitchDelay = 5.0 - minimum time to wait before switching drivers
;battleGap = 0.75 - the gaps between two cars (in seconds) to determine a battle
;battleCams = 3^1^10|0^1^10|1^1^10 - the list of cameras used when swtiching occurs because 2 cars are within the battleGap
;leadersOverClosest = 1 - 1 to prefer battles at the front of the grid over the closest battles
;noDrivableCamWithVirtualMirror = 1 - do not allow cams 0 or 2, use the first Car cam instead (hopefully when virutal mirrors are detected, but for now always)
;HideIcon hides AC icon.
;appwidth = 90 - width of the app window
;appheight = 55 - height of the app window
;backgroundopacity = 0.5 - opacity of the window background
;drawborder = 0 - enable/disable drawing the window border
;verbose can turn off some of the extra messaging, if you'd like to minimize what's written to the console and the py_log.txt
;Camera acsys.CM.Cockpit = 0
;Camera acsys.CM.Car = 1
;Camera acsys.CM.Drivable = 2
;Camera acsys.CM.Track = 3
;Camera acsys.CM.Helicopter = 4
;Camera acsys.CM.OnBoardFree = 5
;Camera acsys.CM.Free = 6
;Camera acsys.CM.Random = 7
;Camera acsys.CM.ImageGeneratorCamera = 8
;Camera acsys.CM.Start = 9
;cameraSwitching = 0^10^10|1^20^10|2^10^10|3^80^15|4^2^5|5^0^10|6^0^10|7^5^5|8^0^10|9^0^10
;cameraSwitching = 0^10^10|1^20^10|2^10^10|3^80^15|4^2^5|5^0^10|6^0^10|7^5^5|8^0^10|9^0^10
;Albano camera switching values
;cameraSwitching = 0^0^10|1^20^10|2^0^10|3^80^15|4^0^5|5^0^10|6^0^10|7^0^5|8^0^10|9^0^10
;the three numbers are Camera^randomizationWeight^cameraSwitchDelay
;pitCameraSwitching and firstLapSwitching are the same as cameraSwitching, but for cars in the Pits and on the First lap
;pitCameraSwitching = 1^1^5|2^1^5|0^1^5|4^1^5
;firstLapSwitching = 3^1^10
;skipdrivers = Esotic Streaming|Place Holder - a list of pipe delimited driver names to exclude/skip from most logic
;preferredDrivers will be exclusively selected if any of them are in the session.  Commented out by default
[SETTINGS]
AutoCamActive = 1
defaultCamera = 3
verbose = 0
;DEFAULTS (Prioritized Track/TV Cameras for a professional broadcast)
cameraSwitching = 3^80^18|0^10^10|1^5^8|4^2^5|7^1^5
firstLapSwitching = 3^1^10
;JUST CAR CAMS for first lap and regular camera switching
;cameraSwitching = 1^1^10
;firstLapSwitching = 1^1^5
;JUST TRACK AND CAR CAMS
;cameraSwitching = 1^30^10|3^20^15
;JUST COCKPIT AND TRACK AND CAMS
;cameraSwitching = 0^30^10|3^20^15
pitCameraSwitching = 1^1^5|0^1^5|4^1^5
battleCams = 3^2^10|0^1^10|1^1^10
countdownCam = 5
cameraSwitchDelay = 10
cameraSwitchingEnabled = 1
driverSwitchingEnabled = 1
driverSwitchDelay = 15
minPitKMH = 40.0
maxPitKMH = 85.0
offPaceSwitchDelay = 240.0
offPaceCanOverrideBattles = 1
minSwitchDelay = 5.0
battleGap = 0.5
leadersOverClosest = 1
noDrivableCamWithVirtualMirror = 1

; professional director settings
positionDecay = 0.92
incidentDetection = 1
incidentMinNormalSpeed = 60.0
incidentMaxSpeed = 25.0
incidentDuration = 8.0
forceTrackCamOnCloseBattles = 1
closeBattleThreshold = 0.35

hideicon = 1
appwidth = 280
appheight = 716
backgroundopacity = 0.5
drawborder = 0
skipdrivers = Esotic Streaming|Place Holder|TV CREW|TV CREW 2|TV CREW 3|pit_TV|TV1|TV2
;only define this in the IP INI files?
;promoText = Visit bit.ly/esotic-videos to watch this race's AutoCast
;monday = Esotic Streaming|Place Holder
;tuesday = Esotic Streaming|Place Holder
;wednesday = Esotic Streaming|Place Holder
;thursday = Esotic Streaming|Place Holder
;friday = Esotic Streaming|Place Holder
;saturday = Esotic Streaming|Place Holder
;sunday = Esotic Streaming|Place Holder
;saturday = Esotic Streaming|Place Holder|TV CREW|TV CREW 2|TV CREW 3|pit_TV
;sunday = Esotic Streaming|Place Holder|TV CREW|TV CREW 2|TV CREW 3|pit_TV
;preferredDrivers = Example Name 1|Example Name 2
